<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">

   <!-- SEO FIXES -->

   <style>
     *{margin:0; padding:0; box-sizing:border-box;}
     body{font-family:Arial, sans-serif; background:#fdf6ec; color:#333; line-height:1.6;}
     
     /* HEADER & NAV */
     .header-top{
       background:#4d3319; 
       color:white; 
       text-align:center; 
       padding:20px 0;
       font-size:28px;
       letter-spacing:4px;
       text-transform:uppercase;
       font-weight:bold;
     }
     nav{
       background:#000;
       width:100%;
     }
     nav ul{
       list-style:none;
       display:flex;
       justify-content:flex-start;
       padding:0 30px;
       flex-wrap:wrap;
     }
     nav ul li a{
       color:white;
       text-decoration:none;
       font-weight:bold;
       padding:15px 20px;
       display:block;
       transition:0.3s;
     }
     nav ul li a:hover, nav ul li a:focus{
       background:#4d3319;
       outline: 2px solid white; /* ACCESSIBILITY FIX */
     }

     /* MAIN CONTENT */
     main{
       max-width: 1000px;
       margin: 40px auto;
       padding: 0 20px;
       text-align: center;
     }
     h1{
       color: #4d3319;
       font-size: 32px;
       margin-bottom: 30px;
     }
     .staff-card{
       background: white;
       border-radius: 10px;
       padding: 20px;
       box-shadow: 0 4px 8px rgba(0,0,0,0.1);
       display: inline-block;
       max-width: 350px;
     }
     .staff-card img{
       width: 100%;
       height: auto;
       border-radius: 8px;
       margin-bottom: 15px;
     }
     .staff-card h2{
       color: #4d3319;
       font-size: 22px;
     }
     .staff-card p{
       margin: 5px 0;
     }
   </style>
</head>
<body>

  <header>
    <div class="header-top">M FRAGRANCE</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>

        <li><a href="registration.html">Registration</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Meet Our Team</h1>
    
    <div class="staff-card">
      <!-- PERFORMANCE + ACCESSIBILITY + SEO FIX: Compressed image, lazy loading, alt text, width/height -->
      <img 
        src="portia.jpg" 
        alt="Portia Maladji, Owner of M Fragrance, standing outside" 
        width="300" 
        height="300"
        loading="lazy">

      <p><strong>Phone:</strong> 079 000 0296</p>
